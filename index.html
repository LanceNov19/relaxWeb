<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>快乐解压小乐园</title>
<style>
/* ============================================================
   CSS Variables & Theme System
   ============================================================ */
:root {
  /* Light theme (default) */
  --bg: #fdf6f0;
  --bg-gradient: linear-gradient(135deg, #fdf6f0 0%, #fce4ec 30%, #f3e5f5 60%, #e8eaf6 100%);
  --card-bg: rgba(255,255,255,0.85);
  --card-border: rgba(255,255,255,0.9);
  --text: #4a4458;
  --text-secondary: #7c7590;
  --heading: #d4687c;
  --accent: #f06292;
  --accent2: #ba68c8;
  --accent3: #64b5f6;
  --tab-active-bg: #fff;
  --tab-inactive: #b39ddb;
  --shadow: 0 4px 20px rgba(149,117,205,0.15);
  --shadow-lg: 0 8px 40px rgba(149,117,205,0.2);
  --btn-bg: linear-gradient(135deg, #f8bbd0, #e1bee7);
  --btn-hover: linear-gradient(135deg, #f48fb1, #ce93d8);
  --btn-text: #fff;
  --divider: rgba(149,117,205,0.15);
  --overlay: rgba(0,0,0,0.5);
  --bubble-color1: #f8bbd0;
  --bubble-color2: #b3e5fc;
  --bubble-color3: #c8e6c9;
  --bubble-color4: #ffe082;
  --bubble-color5: #d1c4e9;
  --slot-bg: #fff;
  --slot-border: #e1bee7;
  --slot-item-bg: linear-gradient(180deg, #fce4ec, #f8bbd0);
  --scratch-coating: #d7ccc8;
}

[data-theme="dark"] {
  --bg: #1a1a2e;
  --bg-gradient: linear-gradient(135deg, #1a1a2e 0%, #16213e 30%, #0f3460 60%, #1a1a2e 100%);
  --card-bg: rgba(30,30,60,0.85);
  --card-border: rgba(255,255,255,0.08);
  --text: #e0dce8;
  --text-secondary: #a9a4b8;
  --heading: #ff8a80;
  --accent: #ff80ab;
  --accent2: #b388ff;
  --accent3: #82b1ff;
  --tab-active-bg: rgba(40,40,70,0.9);
  --tab-inactive: #6a6080;
  --shadow: 0 4px 20px rgba(0,0,0,0.3);
  --shadow-lg: 0 8px 40px rgba(0,0,0,0.4);
  --btn-bg: linear-gradient(135deg, #ff80ab, #b388ff);
  --btn-hover: linear-gradient(135deg, #ff4081, #7c4dff);
  --btn-text: #fff;
  --divider: rgba(255,255,255,0.1);
  --overlay: rgba(0,0,0,0.7);
  --bubble-color1: #ff80ab;
  --bubble-color2: #82b1ff;
  --bubble-color3: #69f0ae;
  --bubble-color4: #ffd740;
  --bubble-color5: #b388ff;
  --slot-bg: rgba(40,40,70,0.9);
  --slot-border: #b388ff;
  --slot-item-bg: linear-gradient(180deg, #2d1b4e, #4a148c);
  --scratch-coating: #5d536b;
}

/* ============================================================
   Global Reset & Base
   ============================================================ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html { font-size: 16px; scroll-behavior: smooth; }

body {
  font-family: 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans SC', system-ui, sans-serif;
  background: var(--bg-gradient);
  color: var(--text);
  min-height: 100vh;
  transition: background 0.4s ease, color 0.4s ease;
  overflow-x: hidden;
  line-height: 1.6;
}

/* Decorative background blobs */
body::before {
  content: '';
  position: fixed;
  top: -200px; right: -150px;
  width: 500px; height: 500px;
  background: radial-gradient(circle, var(--accent) 0%, transparent 70%);
  opacity: 0.12;
  pointer-events: none;
  transition: opacity 0.4s;
}
body::after {
  content: '';
  position: fixed;
  bottom: -150px; left: -100px;
  width: 400px; height: 400px;
  background: radial-gradient(circle, var(--accent2) 0%, transparent 70%);
  opacity: 0.10;
  pointer-events: none;
  transition: opacity 0.4s;
}

/* ============================================================
   Layout
   ============================================================ */
.app-container {
  max-width: 720px;
  margin: 0 auto;
  padding: 16px 20px 40px;
  position: relative;
  z-index: 1;
}

/* ============================================================
   Header
   ============================================================ */
.app-header {
  text-align: center;
  padding: 20px 0 12px;
}
.app-title {
  font-size: 1.8rem;
  font-weight: 700;
  background: linear-gradient(135deg, var(--accent), var(--accent2), var(--accent3));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  letter-spacing: 0.05em;
}
.app-subtitle {
  font-size: 0.85rem;
  color: var(--text-secondary);
  margin-top: 2px;
}

/* Header controls */
.header-controls {
  display: flex;
  justify-content: center;
  gap: 10px;
  margin-top: 12px;
  flex-wrap: wrap;
}
.ctrl-btn {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 7px 14px;
  border-radius: 20px;
  border: 1.5px solid var(--divider);
  background: var(--card-bg);
  color: var(--text);
  cursor: pointer;
  font-size: 0.82rem;
  transition: all 0.25s;
  user-select: none;
  white-space: nowrap;
}
.ctrl-btn:hover { transform: translateY(-1px); box-shadow: var(--shadow); }
.ctrl-btn:active { transform: scale(0.96); }
.ctrl-btn.active { border-color: var(--accent); background: var(--accent); color: #fff; }
.ctrl-btn .icon { font-size: 1.1rem; }

/* ============================================================
   Tab Navigation
   ============================================================ */
.tab-nav {
  display: flex;
  justify-content: center;
  gap: 4px;
  margin: 20px 0 0;
  background: var(--card-bg);
  border-radius: 28px;
  padding: 5px;
  box-shadow: var(--shadow);
  position: sticky;
  top: 12px;
  z-index: 10;
  backdrop-filter: blur(10px);
}
.tab-btn {
  flex: 1;
  padding: 10px 8px;
  border: none;
  border-radius: 24px;
  background: transparent;
  color: var(--tab-inactive);
  cursor: pointer;
  font-size: 0.88rem;
  font-weight: 600;
  transition: all 0.3s cubic-bezier(0.4,0,0.2,1);
  position: relative;
  white-space: nowrap;
}
.tab-btn:hover { color: var(--accent); }
.tab-btn.active {
  background: var(--tab-active-bg);
  color: var(--accent);
  box-shadow: 0 2px 12px rgba(0,0,0,0.1);
}
.tab-emoji { font-size: 1.2rem; margin-right: 3px; }

/* ============================================================
   Main Content Area
   ============================================================ */
.main-content {
  margin-top: 18px;
  min-height: 420px;
  position: relative;
}
.module-panel {
  display: none;
  animation: fadeSlideIn 0.35s ease;
}
.module-panel.active { display: block; }

@keyframes fadeSlideIn {
  from { opacity: 0; transform: translateY(12px); }
  to { opacity: 1; transform: translateY(0); }
}

/* ============================================================
   Card Container (shared)
   ============================================================ */
.card {
  background: var(--card-bg);
  border-radius: 20px;
  padding: 24px;
  box-shadow: var(--shadow);
  border: 1px solid var(--card-border);
  margin-bottom: 16px;
  backdrop-filter: blur(8px);
  transition: all 0.3s;
}
.card-title {
  font-size: 1.1rem;
  font-weight: 700;
  color: var(--heading);
  margin-bottom: 12px;
  display: flex;
  align-items: center;
  gap: 6px;
}

/* ============================================================
   Buttons
   ============================================================ */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 10px 20px;
  border: none;
  border-radius: 24px;
  background: var(--btn-bg);
  color: var(--btn-text);
  font-size: 0.9rem;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.25s;
  user-select: none;
  letter-spacing: 0.03em;
}
.btn:hover { background: var(--btn-hover); transform: translateY(-2px); box-shadow: var(--shadow); }
.btn:active { transform: scale(0.95); }
.btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
.btn-sm { padding: 6px 14px; font-size: 0.8rem; }
.btn-outline {
  background: transparent;
  border: 1.5px solid var(--accent);
  color: var(--accent);
}
.btn-outline:hover { background: var(--accent); color: #fff; }

/* ============================================================
   Module 1: Scratch Card
   ============================================================ */
.scratch-wrapper {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
}
.scratch-canvas-container {
  position: relative;
  width: 100%;
  max-width: 380px;
  aspect-ratio: 3 / 2;
  border-radius: 16px;
  overflow: hidden;
  box-shadow: var(--shadow-lg);
  cursor: pointer;
  touch-action: none;
}
.scratch-canvas-container canvas {
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
}
#scratch-bg-canvas { z-index: 1; }
#scratch-fg-canvas { z-index: 2; }
.scratch-percent {
  margin-top: 8px;
  font-size: 0.85rem;
  color: var(--text-secondary);
}
.scratch-category {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  justify-content: center;
  margin: 10px 0;
}
.cat-btn {
  padding: 5px 12px;
  border-radius: 16px;
  border: 1.5px solid var(--divider);
  background: transparent;
  color: var(--text);
  cursor: pointer;
  font-size: 0.78rem;
  transition: all 0.2s;
}
.cat-btn:hover { border-color: var(--accent); }
.cat-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }
.scratch-actions {
  display: flex;
  gap: 10px;
  margin-top: 12px;
}

/* Fullscreen preview */
.scratch-preview-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: var(--overlay);
  z-index: 100;
  justify-content: center;
  align-items: center;
  flex-direction: column;
  backdrop-filter: blur(4px);
}
.scratch-preview-overlay.show { display: flex; }
.scratch-preview-content {
  background: var(--card-bg);
  border-radius: 20px;
  padding: 40px;
  text-align: center;
  max-width: 90vw;
  box-shadow: var(--shadow-lg);
  animation: popIn 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}
.scratch-preview-content .emoji { font-size: 4rem; }
.scratch-preview-content .text { font-size: 1.5rem; margin: 16px 0; color: var(--heading); font-weight: 600; }

@keyframes popIn {
  from { transform: scale(0.8); opacity: 0; }
  to { transform: scale(1); opacity: 1; }
}

/* ============================================================
   Module 2: Bubble Pop
   ============================================================ */
.bubble-config {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
  justify-content: center;
  margin-bottom: 12px;
}
.difficulty-btn {
  padding: 6px 14px;
  border-radius: 16px;
  border: 1.5px solid var(--divider);
  background: transparent;
  color: var(--text);
  cursor: pointer;
  font-size: 0.82rem;
  transition: all 0.2s;
}
.difficulty-btn:hover { border-color: var(--accent); }
.difficulty-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }
.bubble-count-input {
  width: 60px;
  padding: 6px 8px;
  border: 1.5px solid var(--divider);
  border-radius: 12px;
  background: var(--card-bg);
  color: var(--text);
  text-align: center;
  font-size: 0.85rem;
}
.bubble-count-input:focus { outline: none; border-color: var(--accent); }

.bubble-canvas-wrapper {
  position: relative;
  width: 100%;
  border-radius: 16px;
  overflow: hidden;
  background: var(--card-bg);
  box-shadow: var(--shadow);
  cursor: pointer;
  touch-action: none;
  min-height: 300px;
}
#bubble-canvas {
  display: block;
  width: 100%;
  height: 100%;
}

.bubble-stats {
  display: flex;
  justify-content: space-around;
  align-items: center;
  margin-top: 12px;
  flex-wrap: wrap;
  gap: 10px;
}
.stat-box {
  text-align: center;
  padding: 8px 16px;
  background: var(--card-bg);
  border-radius: 12px;
  box-shadow: var(--shadow);
  min-width: 80px;
}
.stat-label { font-size: 0.72rem; color: var(--text-secondary); }
.stat-value { font-size: 1.3rem; font-weight: 700; color: var(--accent); font-variant-numeric: tabular-nums; }
.stat-value.record { color: var(--accent2); }

.bubble-actions {
  display: flex;
  gap: 10px;
  justify-content: center;
  margin-top: 12px;
  flex-wrap: wrap;
}
.game-status {
  text-align: center;
  font-size: 0.9rem;
  font-weight: 600;
  padding: 6px 16px;
  border-radius: 16px;
  display: inline-block;
}
.status-waiting { background: #e8eaf6; color: #5c6bc0; }
.status-playing { background: #fce4ec; color: #e91e63; animation: pulse 1.2s infinite; }
.status-done { background: #e8f5e9; color: #43a047; }

@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.6; }
}

/* Record notification */
.record-notify {
  position: fixed;
  top: 20px;
  left: 50%;
  transform: translateX(-50%) translateY(-120px);
  background: linear-gradient(135deg, #ffd740, #ffab00);
  color: #333;
  padding: 12px 28px;
  border-radius: 28px;
  font-weight: 700;
  font-size: 1rem;
  box-shadow: 0 6px 30px rgba(255,171,0,0.5);
  z-index: 200;
  transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  pointer-events: none;
}
.record-notify.show { transform: translateX(-50%) translateY(0); }

/* ============================================================
   Module 3: Mental State Generator
   ============================================================ */
.gen-wrapper {
  display: flex;
  flex-direction: column;
  align-items: center;
}

/* Orb container */
.gen-orb-container {
  position: relative;
  width: 260px;
  height: 260px;
  margin: 0 auto 10px;
}

/* The main orb */
.gen-orb {
  position: absolute;
  inset: 0;
  border-radius: 50%;
  background: radial-gradient(circle at 35% 30%, rgba(255,255,255,0.3), transparent 50%),
              radial-gradient(circle, var(--accent2) 0%, var(--accent) 40%, #7c4dff 80%, #311b92 100%);
  box-shadow: 0 0 40px rgba(156, 39, 176, 0.4), 0 0 80px rgba(156, 39, 176, 0.2), inset 0 0 30px rgba(255,255,255,0.1);
  display: flex;
  align-items: center;
  justify-content: center;
  transition: box-shadow 0.6s;
  z-index: 2;
}
.gen-orb.generating {
  box-shadow: 0 0 60px rgba(255, 64, 129, 0.6), 0 0 120px rgba(156, 39, 176, 0.4), 0 0 200px rgba(123, 31, 162, 0.3);
  animation: orbPulse 0.4s ease-in-out infinite;
}
@keyframes orbPulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.04); }
}

/* Spinning rings around orb */
.gen-ring {
  position: absolute;
  inset: -16px;
  border-radius: 50%;
  border: 2px solid transparent;
  pointer-events: none;
  z-index: 1;
}
.gen-ring-1 {
  inset: -18px;
  border-top-color: rgba(255, 255, 255, 0.5);
  border-right-color: rgba(255, 255, 255, 0.25);
  animation: ringSpin 3s linear infinite;
}
.gen-ring-2 {
  inset: -28px;
  border-left-color: rgba(255, 255, 255, 0.35);
  border-bottom-color: rgba(255, 255, 255, 0.15);
  animation: ringSpin 4.5s linear infinite reverse;
}
.gen-ring-3 {
  inset: -36px;
  border-top-color: rgba(255, 200, 255, 0.3);
  border-left-color: rgba(255, 200, 255, 0.1);
  animation: ringSpin 6s linear infinite;
}
.gen-orb.generating .gen-ring-1 { animation-duration: 0.6s; }
.gen-orb.generating .gen-ring-2 { animation-duration: 0.8s; }
.gen-orb.generating .gen-ring-3 { animation-duration: 1.0s; }
@keyframes ringSpin {
  from { transform: rotate(0deg); }
  to { transform: rotate(360deg); }
}

/* Core text */
.gen-core {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  z-index: 3;
  pointer-events: none;
}
.gen-core-emoji {
  font-size: 2.8rem;
  transition: transform 0.3s;
  filter: drop-shadow(0 2px 8px rgba(0,0,0,0.3));
}
.gen-core-text {
  font-size: 0.85rem;
  font-weight: 700;
  color: #fff;
  text-shadow: 0 1px 6px rgba(0,0,0,0.5);
  transition: all 0.2s;
}
.gen-orb.generating .gen-core-emoji {
  animation: emojiJitter 0.1s infinite;
}
@keyframes emojiJitter {
  0%, 100% { transform: translate(0, 0) scale(1); }
  25% { transform: translate(-2px, 1px) scale(1.05); }
  50% { transform: translate(2px, -1px) scale(1.05); }
  75% { transform: translate(1px, 2px) scale(1.05); }
}

/* Floating particles */
.gen-particles {
  position: absolute;
  inset: -50px;
  pointer-events: none;
  z-index: 4;
}
.gen-particle {
  position: absolute;
  font-size: 1.2rem;
  pointer-events: none;
  animation: particleFloat 3s ease-in-out infinite;
  opacity: 0.7;
  filter: drop-shadow(0 0 4px currentColor);
}
@keyframes particleFloat {
  0%, 100% { transform: translate(0, 0) scale(0.8); opacity: 0.3; }
  25% { transform: translate(10px, -15px) scale(1.2); opacity: 0.9; }
  50% { transform: translate(-5px, -25px) scale(0.6); opacity: 0.5; }
  75% { transform: translate(-15px, -10px) scale(1.1); opacity: 0.8; }
}
.gen-orb.generating ~ .gen-particles .gen-particle {
  animation-duration: 0.8s;
}

/* Generate button */
.gen-btn {
  margin: 6px 0;
  font-size: 1rem !important;
  padding: 12px 28px !important;
  background: linear-gradient(135deg, #7c4dff, #e040fb) !important;
  box-shadow: 0 4px 20px rgba(156, 39, 176, 0.4) !important;
}
.gen-btn:hover {
  background: linear-gradient(135deg, #651fff, #d500f9) !important;
  box-shadow: 0 6px 30px rgba(156, 39, 176, 0.55) !important;
}
.gen-btn:disabled {
  opacity: 0.6;
  cursor: not-allowed;
  animation: btnPulse 0.6s ease-in-out infinite;
}
@keyframes btnPulse {
  0%, 100% { box-shadow: 0 4px 20px rgba(156, 39, 176, 0.4); }
  50% { box-shadow: 0 4px 35px rgba(255, 64, 129, 0.7); }
}

/* Result */
.gen-result {
  text-align: center;
  min-height: 60px;
  margin-top: 8px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}
.gen-result-text {
  font-size: 1.4rem;
  font-weight: 700;
  color: var(--heading);
  animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}
.gen-result-emoji {
  font-size: 3rem;
  display: block;
  animation: resultBounce 0.7s ease;
}
@keyframes resultBounce {
  0% { transform: scale(0) rotate(-30deg); opacity: 0; }
  50% { transform: scale(1.3) rotate(5deg); }
  70% { transform: scale(0.9) rotate(-2deg); }
  100% { transform: scale(1) rotate(0deg); opacity: 1; }
}

/* Screen shake */
.screen-shake {
  animation: shake 0.5s ease-in-out;
}
@keyframes shake {
  0%, 100% { transform: translateX(0); }
  10% { transform: translateX(-8px) rotate(-1deg); }
  20% { transform: translateX(8px) rotate(1deg); }
  30% { transform: translateX(-6px); }
  40% { transform: translateX(6px); }
  60% { transform: translateX(-4px); }
  80% { transform: translateX(4px); }
}

/* Confetti */
.confetti-container {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 300;
}
.confetti-piece {
  position: absolute;
  width: 10px;
  height: 10px;
  animation: confettiFall 2s ease-out forwards;
}
@keyframes confettiFall {
  0% { transform: translateY(-100px) rotate(0deg); opacity: 1; }
  100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
}

/* Star burst particles (generated during reveal) */
.star-burst {
  position: absolute;
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: #fff;
  pointer-events: none;
  z-index: 10;
  animation: starBurst 0.8s ease-out forwards;
}
@keyframes starBurst {
  0% { transform: translate(0, 0) scale(1); opacity: 1; }
  100% { transform: translate(var(--sx), var(--sy)) scale(0); opacity: 0; }
}

/* ============================================================
   Footer
   ============================================================ */
.app-footer {
  text-align: center;
  padding: 20px 0 0;
  font-size: 0.75rem;
  color: var(--text-secondary);
  opacity: 0.7;
}

/* ============================================================
   Toast
   ============================================================ */
.toast {
  position: fixed;
  bottom: 30px;
  left: 50%;
  transform: translateX(-50%) translateY(100px);
  background: var(--text);
  color: var(--bg);
  padding: 10px 24px;
  border-radius: 24px;
  font-size: 0.85rem;
  z-index: 500;
  transition: transform 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  pointer-events: none;
}
.toast.show { transform: translateX(-50%) translateY(0); }

/* ============================================================
   Responsive
   ============================================================ */
@media (max-width: 600px) {
  .app-title { font-size: 1.4rem; }
  .tab-btn { font-size: 0.75rem; padding: 8px 6px; }
  .tab-emoji { font-size: 1rem; }
  .card { padding: 16px; }
  .slot-column { width: 90px; height: 180px; }

<script>
(function() {
'use strict';

// ============================================================
// Global State
// ============================================================
const STATE = {
  theme: localStorage.getItem('relax-theme') || 'light',
  soundOn: localStorage.getItem('relax-sound') !== 'off',
  animationMode: localStorage.getItem('relax-anim') || 'smooth',
  activeTab: 'scratch',
  // Bubble best records: { '10': ms, '30': ms, '50': ms, 'custom-N': ms }
  bubbleRecords: JSON.parse(localStorage.getItem('relax-bubble-records') || '{}'),
};

function saveState() {
  localStorage.setItem('relax-theme', STATE.theme);
  localStorage.setItem('relax-sound', STATE.soundOn ? 'on' : 'off');
  localStorage.setItem('relax-anim', STATE.animationMode);
  localStorage.setItem('relax-bubble-records', JSON.stringify(STATE.bubbleRecords));
}

// ============================================================
// Sound Engine (Web Audio API)
// ============================================================
let audioCtx = null;
function getAudioCtx() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  return audioCtx;
}

function playTone(freq, duration, type = 'sine', vol = 0.15, rampDown = true) {
  if (!STATE.soundOn) return;
  try {
    const ctx = getAudioCtx();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, ctx.currentTime);
    gain.gain.setValueAtTime(vol, ctx.currentTime);
    if (rampDown) gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start(ctx.currentTime);
    osc.stop(ctx.currentTime + duration);
  } catch(e) { /* ignore audio errors */ }
}

function playScratchSound() {
  if (!STATE.soundOn) return;
  try {
    const ctx = getAudioCtx();
    const bufferSize = ctx.sampleRate * 0.05;
    const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) {
      data[i] = (Math.random() * 2 - 1) * 0.08;
    }
    const source = ctx.createBufferSource();
    source.buffer = buffer;
    const gain = ctx.createGain();
    gain.gain.setValueAtTime(0.06, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.05);
    const filter = ctx.createBiquadFilter();
    filter.type = 'highpass';
    filter.frequency.setValueAtTime(3000, ctx.currentTime);
    source.connect(filter);
    filter.connect(gain);
    gain.connect(ctx.destination);
    source.start();
  } catch(e) { /* ignore */ }
}

function playPopSound() {
  playTone(800, 0.15, 'sine', 0.12);
  playTone(1200, 0.08, 'sine', 0.06);
}

function playTickSound() {
  playTone(200, 0.03, 'square', 0.04);
}

function playDingSound() {
  playTone(880, 0.2, 'sine', 0.12);
  setTimeout(() => playTone(1100, 0.25, 'sine', 0.1), 150);
}

function playCelebrationSound() {
  const notes = [523, 659, 784, 1047, 784, 1047];
  notes.forEach((f, i) => {
    setTimeout(() => playTone(f, 0.2, 'sine', 0.1), i * 100);
  });
}

function playWinSound() {
  [523, 659, 784].forEach((f, i) => {
    setTimeout(() => playTone(f, 0.3, 'triangle', 0.1), i * 120);
  });
}

// ============================================================
// DOM References
// ============================================================
const $ = (s) => document.querySelector(s);
const $$ = (s) => document.querySelectorAll(s);

// ============================================================
// Theme Toggle
// ============================================================
function applyTheme() {
  document.documentElement.setAttribute('data-theme', STATE.theme);
  const btn = $('#themeToggle');
  if (STATE.theme === 'light') {
    btn.querySelector('.icon').textContent = '☀️';
    btn.querySelector('.label').textContent = '浅色模式';
  } else {
    btn.querySelector('.icon').textContent = '🌙';
    btn.querySelector('.label').textContent = '深色模式';
  }
}

$('#themeToggle').addEventListener('click', () => {
  STATE.theme = STATE.theme === 'light' ? 'dark' : 'light';
  applyTheme();
  saveState();
});

// ============================================================
// Sound Toggle
// ============================================================
function applySoundToggle() {
  const btn = $('#soundToggle');
  if (STATE.soundOn) {
    btn.querySelector('.icon').textContent = '🔊';
    btn.querySelector('.label').textContent = '音效开启';
    btn.classList.add('active');
  } else {
    btn.querySelector('.icon').textContent = '🔇';
    btn.querySelector('.label').textContent = '音效关闭';
    btn.classList.remove('active');
  }
}

$('#soundToggle').addEventListener('click', () => {
  STATE.soundOn = !STATE.soundOn;
  applySoundToggle();
  saveState();
});

// ============================================================
// Animation Toggle
// ============================================================
function applyAnimMode() {
  const btn = $('#animToggle');
  if (STATE.animationMode === 'smooth') {
    document.documentElement.removeAttribute('data-animation');
    btn.querySelector('.icon').textContent = '✨';
    btn.querySelector('.label').textContent = '流畅动画';
  } else {
    document.documentElement.setAttribute('data-animation', 'minimal');
    btn.querySelector('.icon').textContent = '💨';
    btn.querySelector('.label').textContent = '极简动画';
  }
}

$('#animToggle').addEventListener('click', () => {
  STATE.animationMode = STATE.animationMode === 'smooth' ? 'minimal' : 'smooth';
  applyAnimMode();
  saveState();
});

// ============================================================
// Tab Switching
// ============================================================
function switchTab(tabName) {
  STATE.activeTab = tabName;
  $$('.tab-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.tab === tabName);
    b.setAttribute('aria-selected', b.dataset.tab === tabName ? 'true' : 'false');
  });
  $$('.module-panel').forEach(p => {
    p.classList.toggle('active', p.id === `panel-${tabName}`);
  });
  // Initialize canvases when switching to a module
  if (tabName === 'scratch') initScratchCard();
  if (tabName === 'bubble') initBubblePop();
  if (tabName === 'slot') initGenerator();
}

$$('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => switchTab(btn.dataset.tab));
});

// ============================================================
// Toast
// ============================================================
let toastTimer = null;
function showToast(msg, duration = 2000) {
  const toast = $('#toast');
  toast.textContent = msg;
  toast.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove('show'), duration);
}

// ============================================================
// Confetti Effect
// ============================================================
function spawnConfetti(container) {
  const colors = ['#ff5252','#ff4081','#ffd740','#69f0ae','#40c4ff','#b388ff','#ff80ab','#ffab40'];
  for (let i = 0; i < 60; i++) {
    const piece = document.createElement('div');
    piece.className = 'confetti-piece';
    piece.style.left = Math.random() * 100 + '%';
    piece.style.top = -(Math.random() * 60 + 20) + 'px';
    piece.style.width = (Math.random() * 8 + 6) + 'px';
    piece.style.height = (Math.random() * 8 + 6) + 'px';
    piece.style.background = colors[Math.floor(Math.random() * colors.length)];
    piece.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
    piece.style.animationDuration = (Math.random() * 2 + 1.5) + 's';
    piece.style.animationDelay = Math.random() * 0.5 + 's';
    container.appendChild(piece);
    setTimeout(() => piece.remove(), 3000);
  }
}

// ============================================================
// MODULE 1: Scratch Card
// ============================================================
const scratchQuotes = {
  bailan: [
    { text: '今天的班就上到这里，灵魂已下班', emoji: '😴' },
    { text: '电量不足，拒绝营业', emoji: '🔋' },

    { text: '每天都在上演"我不想上班"的内心戏', emoji: '🎭' },
    { text: '今日工作饱和度：0%，摸鱼纯度：100%', emoji: '🐟' },
    { text: '人在工位，心在夏威夷', emoji: '🏖️' },
    { text: '间歇性踌躇满志，持续性混吃等死', emoji: '🦥' },
  ],
  heal: [
    { text: '今天也是被好运包围的一天', emoji: '🍀' },
    { text: '慢慢来，一切都会变好', emoji: '🌱' },
    { text: '平凡的日子也在闪闪发光', emoji: '✨' },
    { text: '今天也辛苦啦，好好放松一下', emoji: '💆' },
    { text: '你已经很棒了，记得给自己点个赞', emoji: '👍' },
    { text: '生活明朗，万物可爱', emoji: '🌸' },
    { text: '温柔对待自己，你值得世间美好', emoji: '💖' },
    { text: '即使步伐很小，也是在向前走', emoji: '🐢' },
  ],
  funny: [
    { text: '发财这件事，我全靠做梦', emoji: '💸' },
    { text: '智商暂时下线，请勿较真', emoji: '🤪' },

    { text: '我的底线：没有底线', emoji: '📏' },
    { text: '颜值不稳定，主要看天气', emoji: '🌤️' },

  ],
  lucky: [
    { text: '暴富暴美，万事顺遂', emoji: '💰' },

let scratchState = {
  category: 'all',
  currentQuote: null,
  isRevealed: false,
  initialized: false,
  listenersAttached: false,
};

function getRandomQuote(category) {
  let pool;
  if (category === 'all' || !scratchQuotes[category]) {
    pool = Object.values(scratchQuotes).flat();
  } else {
    pool = scratchQuotes[category];
  }
  return pool[Math.floor(Math.random() * pool.length)];
}

function initScratchCard() {
  if (scratchState.initialized) return;
  scratchState.initialized = true;
  setupScratchCanvas();
}

function setupScratchCanvas() {
  const container = $('#scratchContainer');
  const bgCanvas = $('#scratch-bg-canvas');
  const fgCanvas = $('#scratch-fg-canvas');

  const dpr = window.devicePixelRatio || 1;
  const rect = container.getBoundingClientRect();
  const w = rect.width;
  const h = rect.height;

  bgCanvas.width = w * dpr;
  bgCanvas.height = h * dpr;
  fgCanvas.width = w * dpr;
  fgCanvas.height = h * dpr;

  bgCanvas.style.width = w + 'px';
  bgCanvas.style.height = h + 'px';
  fgCanvas.style.width = w + 'px';
  fgCanvas.style.height = h + 'px';

  const bgCtx = bgCanvas.getContext('2d');
  const fgCtx = fgCanvas.getContext('2d');

  bgCtx.scale(dpr, dpr);
  fgCtx.scale(dpr, dpr);

  // Pick random quote
  scratchState.currentQuote = getRandomQuote(scratchState.category);
  scratchState.isRevealed = false;
  $('#scratchPreview').disabled = true;

  // Draw background (text + emoji)
  bgCtx.clearRect(0, 0, w, h);
  // Gradient background
  const bgGrad = bgCtx.createLinearGradient(0, 0, w, h);
  bgGrad.addColorStop(0, '#fff9c4');
  bgGrad.addColorStop(0.5, '#f8bbd0');
  bgGrad.addColorStop(1, '#e1bee7');
  bgCtx.fillStyle = bgGrad;
  bgCtx.fillRect(0, 0, w, h);

  // Decorative circles
  bgCtx.fillStyle = 'rgba(255,255,255,0.3)';
  bgCtx.beginPath();
  bgCtx.arc(w * 0.2, h * 0.3, w * 0.12, 0, Math.PI * 2);
  bgCtx.fill();
  bgCtx.beginPath();
  bgCtx.arc(w * 0.8, h * 0.7, w * 0.08, 0, Math.PI * 2);
  bgCtx.fill();

  // Emoji
  bgCtx.font = `${h * 0.35}px "Segoe UI Emoji", "Apple Color Emoji", "Noto Color Emoji", sans-serif`;
  bgCtx.textAlign = 'center';
  bgCtx.fillText(scratchState.currentQuote.emoji, w / 2, h * 0.42);

  // Text
  bgCtx.font = `bold ${Math.min(w * 0.06, 22)}px "PingFang SC", "Microsoft YaHei", sans-serif`;
  bgCtx.fillStyle = '#4a4458';
  bgCtx.textAlign = 'center';
  const words = scratchState.currentQuote.text.split('');
  const lineLength = Math.min(12, Math.ceil(words.length / 2));
  const lines = [];
  for (let i = 0; i < words.length; i += lineLength) {
    lines.push(words.slice(i, i + lineLength).join(''));
  }
  lines.forEach((line, i) => {
    bgCtx.fillText(line, w / 2, h * 0.7 + i * (Math.min(w * 0.07, 26)));
  });

  // Draw foreground (scratch coating)
  fgCtx.clearRect(0, 0, w, h);
  fgCtx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--scratch-coating').trim() || '#c0b0a0';
  fgCtx.fillRect(0, 0, w, h);

  // Add texture to coating
  fgCtx.fillStyle = 'rgba(0,0,0,0.03)';
  for (let i = 0; i < 200; i++) {
    const x = Math.random() * w;
    const y = Math.random() * h;
    const r = Math.random() * 3 + 1;
    fgCtx.beginPath();
    fgCtx.arc(x, y, r, 0, Math.PI * 2);
    fgCtx.fill();
  }

  // Hint text
  fgCtx.fillStyle = 'rgba(255,255,255,0.7)';
  fgCtx.font = `${Math.min(w * 0.045, 16)}px "PingFang SC", "Microsoft YaHei", sans-serif`;
  fgCtx.textAlign = 'center';
  fgCtx.fillText('👆 用手指或鼠标刮开这里', w / 2, h / 2);

  // Setup scratch interaction
  setupScratchInteraction(fgCanvas, fgCtx, w, h, container);
}

// Grid-based scratch tracking — avoids expensive getImageData()
const SCRATCH_GRID = { cols: 24, rows: 16 };
let scratchedGrid = [];
let scratchPercent = 0;
let scratchPercentTimer = null;

function resetScratchGrid(w, h) {
  scratchedGrid = [];
  for (let r = 0; r < SCRATCH_GRID.rows; r++) {
    scratchedGrid[r] = new Array(SCRATCH_GRID.cols).fill(false);
  }
}

function markScratchedCells(x, y, w, h) {
  const cellW = w / SCRATCH_GRID.cols;
  const cellH = h / SCRATCH_GRID.rows;
  const r = 26; // scratch radius in CSS px
  const minC = Math.max(0, Math.floor((x - r) / cellW));
  const maxC = Math.min(SCRATCH_GRID.cols - 1, Math.floor((x + r) / cellW));
  const minR = Math.max(0, Math.floor((y - r) / cellH));
  const maxR = Math.min(SCRATCH_GRID.rows - 1, Math.floor((y + r) / cellH));
  let changed = false;
  for (let row = minR; row <= maxR; row++) {
    for (let col = minC; col <= maxC; col++) {
      if (!scratchedGrid[row][col]) {
        scratchedGrid[row][col] = true;
        changed = true;
      }
    }
  }
  return changed;
}

function calcScratchPercent() {
  let count = 0;
  const total = SCRATCH_GRID.cols * SCRATCH_GRID.rows;
  for (let r = 0; r < SCRATCH_GRID.rows; r++) {
    for (let c = 0; c < SCRATCH_GRID.cols; c++) {
      if (scratchedGrid[r][c]) count++;
    }
  }
  return Math.round((count / total) * 100);
}

function setupScratchInteraction(canvas, ctx, w, h, container) {
  if (scratchState.listenersAttached) return;
  scratchState.listenersAttached = true;
  resetScratchGrid(w, h);
  let isScratching = false;

  function getPos(e) {
    const rect = canvas.getBoundingClientRect();
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
    return { x: clientX - rect.left, y: clientY - rect.top };
  }

  function scratch(x, y) {
    // Save and restore fillStyle to prevent persistence bug
    ctx.save();
    ctx.globalCompositeOperation = 'destination-out';
    // Inner solid erasure
    ctx.beginPath();
    ctx.arc(x, y, 20, 0, Math.PI * 2);
    ctx.fillStyle = '#000';
    ctx.fill();
    // Outer soft edge
    ctx.beginPath();
    ctx.arc(x, y, 26, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    ctx.fill();
    ctx.restore();

    // Mark grid cells (fast, no getImageData)
    if (markScratchedCells(x, y, w, h)) {
      // Throttle UI update
      clearTimeout(scratchPercentTimer);
      scratchPercentTimer = setTimeout(() => {
        scratchPercent = calcScratchPercent();
        $('#scratchPercent').textContent = `已刮开: ${scratchPercent}%`;
        if (scratchPercent >= 50 && !scratchState.isRevealed) {
          scratchState.isRevealed = true;
          $('#scratchPreview').disabled = false;
          playDingSound();
          showToast('🎉 刮出来啦！点击放大查看完整内容');
        }
      }, 150);
    }
  }

  function onStart(e) {
    e.preventDefault();
    isScratching = true;
    const pos = getPos(e);
    scratch(pos.x, pos.y);
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
    playScratchSound();
  }

  function onMove(e) {
    if (!isScratching) return;
    e.preventDefault();
    const pos = getPos(e);
    scratch(pos.x, pos.y);
  }

  function onEnd() { isScratching = false; }

  canvas.addEventListener('mousedown', onStart);
  canvas.addEventListener('mousemove', onMove);
  canvas.addEventListener('mouseup', onEnd);
  canvas.addEventListener('mouseleave', onEnd);
  canvas.addEventListener('touchstart', onStart, { passive: false });
  canvas.addEventListener('touchmove', onMove, { passive: false });
  canvas.addEventListener('touchend', onEnd);
}

// MODULE 2: Bubble Pop
// ============================================================
let bubbleState = {
  count: 10,
  bubbles: [],
  gameStatus: 'waiting', // 'waiting' | 'playing' | 'done'
  timerStart: 0,
  timerElapsed: 0,
  timerInterval: null,
  animFrameId: null,
  initialized: false,
  canvasW: 0,
  canvasH: 0,
  popParticles: [],
};

function initBubblePop() {
  if (bubbleState.initialized) return;
  bubbleState.initialized = true;
  setupBubbleCanvas();
  updateBubbleBestDisplay();
  generateBubbles();
  renderBubbles();
}

function setupBubbleCanvas() {
  const wrapper = $('#bubbleWrapper');
  const canvas = $('#bubble-canvas');
  const dpr = window.devicePixelRatio || 1;
  const w = wrapper.clientWidth;
  const h = Math.max(320, Math.min(500, window.innerHeight * 0.45));

  bubbleState.canvasW = w;
  bubbleState.canvasH = h;

  canvas.width = w * dpr;
  canvas.height = h * dpr;
  canvas.style.width = w + 'px';
  canvas.style.height = h + 'px';

  const ctx = canvas.getContext('2d');
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.scale(dpr, dpr);
  wrapper.style.height = h + 'px';
}

function generateBubbles() {
  const w = bubbleState.canvasW;
  const h = bubbleState.canvasH;
  const colors = [
    'var(--bubble-color1)', 'var(--bubble-color2)', 'var(--bubble-color3)',
    'var(--bubble-color4)', 'var(--bubble-color5)',
  ];
  const resolvedColors = colors.map(c => {
    const style = getComputedStyle(document.documentElement);
    return style.getPropertyValue(c.replace('var(', '').replace(')', '')).trim() || '#f8bbd0';
  });

  bubbleState.bubbles = [];
  const margin = 40;
  const maxAttempts = 500;

  for (let i = 0; i < bubbleState.count; i++) {
    let placed = false;
    let attempts = 0;
    while (!placed && attempts < maxAttempts) {
      const r = Math.random() * 18 + 16; // radius 16-34
      const x = Math.random() * (w - 2 * margin) + margin;
      const y = Math.random() * (h - 2 * margin) + margin;
      let overlaps = false;
      for (const b of bubbleState.bubbles) {
        const dx = x - b.x;
        const dy = y - b.y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < r + b.radius + 8) {
          overlaps = true;
          break;
        }
      }
      if (!overlaps) {
        bubbleState.bubbles.push({
          x, y,
          radius: r,
          baseRadius: r,
          color: resolvedColors[Math.floor(Math.random() * resolvedColors.length)],
          alive: true,
          phase: Math.random() * Math.PI * 2, // for float animation
          floatSpeed: Math.random() * 0.02 + 0.01,
          floatAmp: Math.random() * 4 + 2,
          opacity: 1,
        });
        placed = true;
      }
      attempts++;
    }
    // If couldn't place, put it anyway (rare case)
    if (!placed) {
      const r = Math.random() * 16 + 14;
      bubbleState.bubbles.push({
        x: Math.random() * (w - 80) + 40,
        y: Math.random() * (h - 80) + 40,
        radius: r,
        baseRadius: r,
        color: resolvedColors[Math.floor(Math.random() * resolvedColors.length)],
        alive: true,
        phase: Math.random() * Math.PI * 2,
        floatSpeed: Math.random() * 0.02 + 0.01,
        floatAmp: Math.random() * 4 + 2,
        opacity: 1,
      });
    }
  }

  bubbleState.popParticles = [];
  updateBubbleStats();
}

function renderBubbles() {
  const canvas = $('#bubble-canvas');
  const ctx = canvas.getContext('2d');
  const dpr = window.devicePixelRatio || 1;
  const w = bubbleState.canvasW;
  const h = bubbleState.canvasH;

  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.save();
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.scale(dpr, dpr);

    const time = Date.now() * 0.001;

    // Draw bubbles
    for (const b of bubbleState.bubbles) {
      if (!b.alive) continue;

      // Float animation
      const floatY = Math.sin(time * b.floatSpeed * 60 + b.phase) * b.floatAmp;
      const floatX = Math.cos(time * b.floatSpeed * 45 + b.phase + 1) * b.floatAmp * 0.6;
      const cx = b.x + floatX;
      const cy = b.y + floatY;
      const r = b.radius * b.opacity;

      if (r < 1) continue;

      // Bubble body with gradient
      const grad = ctx.createRadialGradient(cx - r * 0.3, cy - r * 0.3, r * 0.1, cx, cy, r);
      grad.addColorStop(0, 'rgba(255,255,255,0.7)');
      grad.addColorStop(0.3, b.color);
      grad.addColorStop(0.7, b.color);
      grad.addColorStop(1, 'rgba(0,0,0,0.08)');

      ctx.beginPath();
      ctx.arc(cx, cy, r, 0, Math.PI * 2);
      ctx.fillStyle = grad;
      ctx.fill();

      // Highlight
      ctx.beginPath();
      ctx.arc(cx - r * 0.25, cy - r * 0.3, r * 0.25, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(255,255,255,0.5)';
      ctx.fill();

      // Shine
      ctx.beginPath();
      ctx.arc(cx - r * 0.15, cy - r * 0.2, r * 0.08, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(255,255,255,0.9)';
      ctx.fill();
    }

    // Draw pop particles
    for (let i = bubbleState.popParticles.length - 1; i >= 0; i--) {
      const p = bubbleState.popParticles[i];
      p.life -= 0.035;
      if (p.life <= 0) {
        bubbleState.popParticles.splice(i, 1);
        continue;
      }
      p.x += p.vx;
      p.y += p.vy;
      p.vy += 0.1; // gravity
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.radius * p.life, 0, Math.PI * 2);
      ctx.fillStyle = p.color.replace('1)', `${p.life})`).replace('rgb', 'rgba');
      if (p.color.startsWith('#')) {
        ctx.fillStyle = p.color + Math.round(p.life * 255).toString(16).padStart(2, '0');
      }
      ctx.globalAlpha = p.life;
      ctx.fill();
      ctx.globalAlpha = 1;
    }

    ctx.restore();
    bubbleState.animFrameId = requestAnimationFrame(draw);
  }

  if (bubbleState.animFrameId) cancelAnimationFrame(bubbleState.animFrameId);
  draw();
}

// Click/touch handler for bubbles
function handleBubblePop(e) {
  if (bubbleState.gameStatus !== 'playing') return;
  e.preventDefault(); // Prevent scrolling on mobile while playing

  // Resume audio context on user gesture
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();

  const canvas = $('#bubble-canvas');
  const rect = canvas.getBoundingClientRect();
  const clientX = e.touches ? e.touches[0].clientX : e.clientX;
  const clientY = e.touches ? e.touches[0].clientY : e.clientY;
  const x = clientX - rect.left;
  const y = clientY - rect.top;

  // Check bubbles in reverse order (top-most first)
  for (let i = bubbleState.bubbles.length - 1; i >= 0; i--) {
    const b = bubbleState.bubbles[i];
    if (!b.alive) continue;
    const time = Date.now() * 0.001;
    const floatY = Math.sin(time * b.floatSpeed * 60 + b.phase) * b.floatAmp;
    const floatX = Math.cos(time * b.floatSpeed * 45 + b.phase + 1) * b.floatAmp * 0.6;
    const dx = x - (b.x + floatX);
    const dy = y - (b.y + floatY);
    const dist = Math.sqrt(dx * dx + dy * dy);
    if (dist <= b.radius) {
      popBubble(i);
      break;
    }
  }
}

$('#bubble-canvas').addEventListener('click', handleBubblePop);
$('#bubble-canvas').addEventListener('touchstart', handleBubblePop, { passive: false });

function popBubble(index) {
  const b = bubbleState.bubbles[index];
  if (!b || !b.alive) return;
  b.alive = false;
  playPopSound();

  // Spawn particles
  const time = Date.now() * 0.001;
  const floatY = Math.sin(time * b.floatSpeed * 60 + b.phase) * b.floatAmp;
  const floatX = Math.cos(time * b.floatSpeed * 45 + b.phase + 1) * b.floatAmp * 0.6;
  const cx = b.x + floatX;
  const cy = b.y + floatY;

  for (let i = 0; i < 12; i++) {
    const angle = (Math.PI * 2 * i) / 12;
    const speed = Math.random() * 4 + 2;
    bubbleState.popParticles.push({
      x: cx,
      y: cy,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      radius: Math.random() * 4 + 2,
      color: b.color,
      life: 1,
    });
  }

  updateBubbleStats();

  // Check if all popped
  const aliveCount = bubbleState.bubbles.filter(b => b.alive).length;
  if (aliveCount === 0) {
    finishGame();
  }
}

function updateBubbleStats() {
  const remaining = bubbleState.bubbles.filter(b => b.alive).length;
  $('#bubbleRemaining').textContent = remaining;
}

function updateTimerDisplay(ms) {
  const totalCs = Math.floor(ms / 10); // centiseconds
  const minutes = Math.floor(totalCs / 6000);
  const seconds = Math.floor((totalCs % 6000) / 100);
  const cs = totalCs % 100;
  $('#bubbleTimer').textContent =
    String(minutes).padStart(2, '0') + ':' +
    String(seconds).padStart(2, '0') + '.' +
    String(cs).padStart(2, '0');
}

function updateBubbleBestDisplay() {
  const key = String(bubbleState.count);
  const best = STATE.bubbleRecords[key];
  if (best !== undefined) {
    const totalCs = Math.floor(best / 10);
    const m = Math.floor(totalCs / 6000);
    const s = Math.floor((totalCs % 6000) / 100);
    const cs = totalCs % 100;
    $('#bubbleBest').textContent =
      String(m).padStart(2, '0') + ':' +
      String(s).padStart(2, '0') + '.' +
      String(cs).padStart(2, '0');
  } else {
    $('#bubbleBest').textContent = '--:--.--';
  }
}

function updateBubbleStatus(status) {
  bubbleState.gameStatus = status;
  const el = $('#bubbleStatus');
  el.className = 'game-status';
  switch (status) {
    case 'waiting':
      el.textContent = '⏳ 等待开始';
      el.classList.add('status-waiting');
      break;
    case 'playing':
      el.textContent = '🎯 游戏中... 快来戳泡泡！';
      el.classList.add('status-playing');
      break;
    case 'done':
      el.textContent = '✅ 挑战完成！';
      el.classList.add('status-done');
      break;
  }
}

function startGame() {
  if (bubbleState.gameStatus === 'playing') return;
  // Reset bubbles
  generateBubbles();
  bubbleState.timerElapsed = 0;
  bubbleState.timerStart = performance.now();
  updateTimerDisplay(0);
  updateBubbleStatus('playing');
  $('#bubbleStart').disabled = true;

  bubbleState.timerInterval = setInterval(() => {
    bubbleState.timerElapsed = performance.now() - bubbleState.timerStart;
    updateTimerDisplay(bubbleState.timerElapsed);
  }, 50); // 20fps, sufficient for centisecond display
}

function finishGame() {
  clearInterval(bubbleState.timerInterval);
  bubbleState.timerElapsed = performance.now() - bubbleState.timerStart;
  updateTimerDisplay(bubbleState.timerElapsed);
  updateBubbleStatus('done');
  $('#bubbleStart').disabled = false;

  playWinSound();

  // Check record
  const key = String(bubbleState.count);
  const prevBest = STATE.bubbleRecords[key];
  const elapsed = Math.round(bubbleState.timerElapsed);

  if (prevBest === undefined || elapsed < prevBest) {
    STATE.bubbleRecords[key] = elapsed;
    saveState();
    updateBubbleBestDisplay();
    // Show record notification
    const notify = $('#recordNotify');
    notify.classList.add('show');
    setTimeout(() => notify.classList.remove('show'), 2500);
  }

  showToast('🎉 全部戳破！用时 ' + $('#bubbleTimer').textContent);
}

function resetBubbleGame() {
  clearInterval(bubbleState.timerInterval);
  if (bubbleState.animFrameId) cancelAnimationFrame(bubbleState.animFrameId);
  bubbleState.gameStatus = 'waiting';
  bubbleState.timerElapsed = 0;
  bubbleState.popParticles = [];
  updateTimerDisplay(0);
  updateBubbleStatus('waiting');
  $('#bubbleStart').disabled = false;
  generateBubbles();
  renderBubbles();
}

const genPrefixes = ['今日状态', '精神电量', '打工模式', '内心活动', '主打一个', '开机模式', '情绪指数', '摆烂等级', '今日精神', '内心现状'];
const genCores = ['离线摆烂', '强行营业', '亢奋发疯', '浑浑噩噩', '快乐超标', 'EMO放空', '半梦半醒', '活力满满', '精神出走', '随缘摸鱼', '亢奋上头', '佛系躺平', '努力硬撑'];
const genSuffixes = ['电量1%', '随缘度日', '快乐加倍', '只想摸鱼', '拒绝思考', '余额不足', '快乐拉满', '无心工作', '只想发呆', '电量告急', '正常运转'];

const genCoreEmoji = {
  '离线摆烂': '😴', '强行营业': '💼', '亢奋发疯': '🤪', '浑浑噩噩': '😶‍🌫️',
  '快乐超标': '🥳', 'EMO放空': '😔', '半梦半醒': '😵', '活力满满': '⚡',
  '精神出走': '👻', '随缘摸鱼': '🐟', '亢奋上头': '🔥', '佛系躺平': '🧘',
  '努力硬撑': '💪',
};

const genEasterEggs = [
  { p: '主打一个', c: '快乐超标', s: '快乐加倍' },
  { p: '今日精神', c: '离线摆烂', s: '只想摸鱼' },
  { p: '情绪指数', c: 'EMO放空', s: '电量告急' },
];

let genState = {
  generating: false,
  result: null,
  initialized: false,
  cycleInterval: null,
};

// Floating symbol particles
const particleSymbols = ['✨', '⭐', '💫', '🌟', '🔮', '💜', '💖', '🪄', '🌙', '💎', '🎀', '🦋'];

function initGenParticles() {
  const container = $('#genParticles');
  if (container.children.length > 0) return; // already initialized
  for (let i = 0; i < 14; i++) {
    const particle = document.createElement('span');
    particle.className = 'gen-particle';
    particle.textContent = particleSymbols[i % particleSymbols.length];
    particle.style.left = (10 + Math.random() * 80) + '%';
    particle.style.top = (Math.random() * 100) + '%';
    particle.style.animationDelay = Math.random() * 3 + 's';
    particle.style.animationDuration = (2.5 + Math.random() * 3) + 's';
    particle.style.color = ['#e040fb', '#ff80ab', '#b388ff', '#ffd740', '#69f0ae'][Math.floor(Math.random() * 5)];
    container.appendChild(particle);
  }
}

function initGenerator() {
  if (genState.initialized) return;
  genState.initialized = true;
  initGenParticles();
}

function generateState() {
  if (genState.generating) return;
  genState.generating = true;
  genState.result = null;
  $('#genResult').innerHTML = '';
  $('#slotCopy').disabled = true;

  const orb = $('#genOrb');
  const coreEmoji = $('#genCoreEmoji');
  const coreText = $('#genCoreText');
  const btn = $('#genBtn');

  orb.classList.add('generating');
  btn.disabled = true;
  coreEmoji.textContent = '🌀';

  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();

  // Phase 1: Rapid cycling (0 → 1800ms) — items flash fast
  const totalDuration = 2200;
  const startTime = performance.now();
  let cycleSpeed = 50; // ms between changes, starts fast

  function cycle() {
    const elapsed = performance.now() - startTime;
    if (elapsed >= totalDuration) {
      // Done cycling — reveal result
      revealResult();
      return;
    }

    // Random items during cycling
    coreText.textContent = genCores[Math.floor(Math.random() * genCores.length)];

    // Gradually slow down
    const progress = elapsed / totalDuration;
    cycleSpeed = 50 + progress * progress * 400; // 50ms → ~450ms
    if (Math.random() < 0.3) playTickSound();

    genState.cycleInterval = setTimeout(cycle, cycleSpeed);
  }

  cycle();

  function revealResult() {
    // Pick random result
    const prefix = genPrefixes[Math.floor(Math.random() * genPrefixes.length)];
    const core = genCores[Math.floor(Math.random() * genCores.length)];
    const suffix = genSuffixes[Math.floor(Math.random() * genSuffixes.length)];
    genState.result = { prefix, core, suffix };
    genState.generating = false;

    // Stop orb animation
    orb.classList.remove('generating');
    btn.disabled = false;

    // Emoji + text reveal
    const emoji = genCoreEmoji[core] || '🎭';
    coreEmoji.textContent = emoji;
    coreText.textContent = core;
    playWinSound();

    // Star burst particles
    spawnStarBurst();

    // Show full result below
    const fullText = `${prefix} · ${core} · ${suffix}`;
    $('#genResult').innerHTML = `
      <span class="gen-result-emoji">${emoji}</span>
      <div class="gen-result-text">${fullText}</div>
    `;
    $('#slotCopy').disabled = false;

    // Check easter egg
    const isEgg = genEasterEggs.some(e => e.p === prefix && e.c === core && e.s === suffix);
    if (isEgg) {
      setTimeout(() => {
        document.body.classList.add('screen-shake');
        setTimeout(() => document.body.classList.remove('screen-shake'), 500);
        spawnConfetti($('#confettiContainer'));
        playCelebrationSound();
        showToast('🌟 离谱精神状态！隐藏彩蛋触发！', 3000);
      }, 300);
    }
  }
}

function spawnStarBurst() {
  const container = $('#genOrb');
  const rect = container.getBoundingClientRect();
  const cx = rect.width / 2;
  const cy = rect.height / 2;
  const colors = ['#e040fb', '#ff80ab', '#b388ff', '#ffd740', '#69f0ae', '#fff'];

  for (let i = 0; i < 30; i++) {
    const star = document.createElement('div');
    star.className = 'star-burst';
    const angle = (Math.PI * 2 * i) / 30;
    const dist = 40 + Math.random() * 80;
    star.style.setProperty('--sx', Math.cos(angle) * dist + 'px');
    star.style.setProperty('--sy', Math.sin(angle) * dist + 'px');
    star.style.left = cx + 'px';
    star.style.top = cy + 'px';
    star.style.background = colors[Math.floor(Math.random() * colors.length)];
    star.style.width = (4 + Math.random() * 6) + 'px';
    star.style.height = star.style.width;
    container.appendChild(star);
    setTimeout(() => star.remove(), 800);
  }
}

// Generator controls
$('#genBtn').addEventListener('click', generateState);

$('#genReroll').addEventListener('click', () => {
  if (!genState.generating) generateState();
});

$('#slotCopy').addEventListener('click', () => {
  if (!genState.result) return;
  const text = `${genState.result.prefix} · ${genState.result.core} · ${genState.result.suffix}`;
  const fullText = `【我的精神状态】${text} 🔮\n— 来自快乐解压小乐园`;
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(fullText).then(() => {
      showToast('📋 已复制到剪贴板，快发朋友圈吧！');
    }).catch(() => fallbackCopy(fullText));
  } else {
    fallbackCopy(fullText);
  }
});

function fallbackCopy(text) {
  const textarea = document.createElement('textarea');
  textarea.value = text;
  textarea.style.position = 'fixed';
  textarea.style.opacity = '0';
  document.body.appendChild(textarea);
  textarea.select();
  try {
    document.execCommand('copy');
    showToast('📋 已复制到剪贴板！');
  } catch(e) {
    showToast('复制失败，请手动复制');
  }
  document.body.removeChild(textarea);
}

// ============================================================
let resizeDebounce = null;
window.addEventListener('resize', () => {
  clearTimeout(resizeDebounce);
  resizeDebounce = setTimeout(() => {
    if (STATE.activeTab === 'scratch') {
      scratchState.initialized = false;
      initScratchCard();
    }
    if (STATE.activeTab === 'bubble') {
      bubbleState.initialized = false;
      initBubblePop();
    }
  }, 300);
});

// ============================================================
// Initialization
// ============================================================
function init() {
  applyTheme();
  applySoundToggle();
  applyAnimMode();
  switchTab(STATE.activeTab);
}
